name: Export verification

# Fails the build on any export regression across the module × alternate-look
# matrix. Two layers:
#   1. gate  — fast, DOM-free: the committed manifest must describe the current
#              matrix (a new module or look with no sweep fails here).
#   2. sweep — the real thing: boots the app and exports every module × look ×
#              mode through the /dev/export-verify harness, auditing that each
#              PPTX still carries its rasterized background and content layers.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "src/lib/taxonomy.ts"
      - "src/lib/style-packs.ts"
      - "src/lib/style-pack-motifs.ts"
      - "src/lib/pack-background-raster.ts"
      - "src/lib/pptx-*.ts"
      - "src/components/slide/**"
      - "scripts/verify-exports.mjs"
      - "tests/snapshots/export-verify.manifest.json"
  # Nightly background job: catches drift from dependency or renderer changes
  # that no single PR path filter would have flagged.
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      coverage:
        description: "Sweep coverage"
        type: choice
        default: sampled
        options: [sampled, full]

jobs:
  gate:
    name: Matrix coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Manifest must cover the current matrix
        run: npx vitest run src/lib/__tests__/export-matrix-manifest.test.ts
      - name: Placement + corner-radius baselines must be present and current
        run: npx vitest run src/lib/__tests__/export-placement.test.ts src/lib/__tests__/export-corner-radius-regression.test.ts src/lib/__tests__/export-radius-token-suite.test.ts src/lib/__tests__/export-radius-scale-parity.test.ts src/lib/__tests__/export-surface-parity.test.ts


  sweep:
    # Sampled on PR/push (~448 exports); full only nightly or on explicit dispatch.
    name: Export sweep (${{ (github.event_name == 'schedule' || inputs.coverage == 'full') && 'FULL 10904 exports' || 'SAMPLED ~448 exports' }})
    runs-on: ubuntu-latest
    needs: gate
    # Measured cost: ~1.05s per export on a warm harness. Sampled ~448 exports
    # fits easily in 25min; the full 10,904-export matrix needs ~3.2h, so the
    # nightly job gets 240min (measured cost + boot/install + headroom).
    timeout-minutes: ${{ (github.event_name == 'schedule' || inputs.coverage == 'full') && 240 || 25 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start app
        run: |
          npm run dev -- --port 8080 > /tmp/dev.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:8080/ && break
            sleep 2
          done
      - name: Export sweep (fails on any regression)
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.coverage }}" = "full" ]; then
            echo "::notice::Running FULL export sweep (every module x look x mode)"
            npm run verify:exports:ci:full
          else
            echo "::notice::Running SAMPLED export sweep - NOT full coverage; full matrix runs nightly"
            npm run verify:exports:ci
          fi
      - name: Placement sweep (geometry must not drift with animation changes)
        run: npm run verify:placement:ci
      - name: Dev server log
        if: failure()
        run: tail -100 /tmp/dev.log

