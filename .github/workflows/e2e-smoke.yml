name: E2E Smoke

on:
  pull_request:
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers (chromium)
        run: bunx playwright install --with-deps chromium

      - name: Build (dev mode)
        run: bun run build:dev
        env:
          NODE_ENV: development

      - name: Start preview server
        run: |
          bun run preview --host 127.0.0.1 --port 8080 > preview.log 2>&1 &
          echo $! > preview.pid
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8080/ > /dev/null; then
              echo "Preview server up"
              exit 0
            fi
            sleep 1
          done
          echo "Preview server failed to start"
          cat preview.log
          exit 1

      - name: Run smoke tests (with trace on failure)
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8080
          # In CI we use Playwright's own browser install, not the sandbox path.
          PLAYWRIGHT_CHROMIUM_PATH: ""
        run: bunx playwright test tests/e2e/smoke-routes.spec.ts --project=chromium --trace=retain-on-failure --reporter=list

      - name: Stop preview server
        if: always()
        run: |
          if [ -f preview.pid ]; then kill "$(cat preview.pid)" || true; fi

      - name: Upload Playwright traces / screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ github.run_id }}
          path: |
            test-results/**
            playwright-report/**
            preview.log
          retention-days: 14
          if-no-files-found: ignore
