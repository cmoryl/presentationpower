name: E2E Smoke

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: e2e-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers (chromium)
        run: bunx playwright install --with-deps chromium

      - name: Start dev server
        run: |
          bun run dev --host 127.0.0.1 --port 8080 > preview.log 2>&1 &
          echo $! > preview.pid
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8080/ > /dev/null; then
              echo "Dev server up"
              exit 0
            fi
            sleep 1
          done
          echo "Preview server failed to start"
          cat preview.log
          exit 1

      - name: Run smoke tests (with trace on failure)
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8080
          # No browser-path override in CI: the `playwright install` step above
          # provides the matching build, and playwright.config.ts resolves it
          # (globalSetup fails the run loudly if it cannot launch).
        run: bunx playwright test tests/e2e/smoke-routes.spec.ts --project=chromium --trace=retain-on-failure --reporter=list

      # Every download the export panel offers (PPTX light/dark, PDF, PNG, ZIP)
      # must open and carry the selected industry background.
      - name: Run all-format export gate
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8080
        run: bunx playwright test tests/e2e/export-all-formats.spec.ts --project=chromium --trace=retain-on-failure --reporter=list




      - name: Stop preview server
        if: always()
        run: |
          if [ -f preview.pid ]; then kill "$(cat preview.pid)" || true; fi

      - name: Upload Playwright traces / screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ github.run_id }}
          path: |
            test-results/**
            playwright-report/**
            preview.log
          retention-days: 14
          if-no-files-found: ignore
