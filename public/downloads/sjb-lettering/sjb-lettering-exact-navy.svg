<title>SAN JUAN BOWL lettering</title>
<desc>TransPerfect San Juan Bowl lettering - exact construction, every coordinate an exact finite decimal (nothing rounded). Units: cap height 120 (cap line 0, baseline 120). Horizon lines: 25.5 / 94.5 serif lines; 49.5-70.5 middle bar (S, B), A counter base and J hook top 70.5; A crossbar underside and L spur top 82.5; S terminals 37.5 / 82.5. Every stem and stroke 33 wide measured square to the stroke; serifs 10.7265625; chamfers 17 at 45 deg; A legs and all W strokes lean 7:24 (16.2602 deg, 7-24-25 triangle, so the 33 width is exact); N diagonal slope 2:1, parallel band. One shadow: exact sweep of each face by (6.5625, 6.5625), exactly 45 deg. Letter gap 12, word space 29, face to face. Each letter group: Shadow path under Face path.</desc>
